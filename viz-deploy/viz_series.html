<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Five Steering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1a1612;
      --muted: #7a7268;
      --line: #e4ddd3;
      --panel: #fffefb;
      --yes: #3d8b6e;
      --yes-dim: #a8d4c2;
      --rail-w: minmax(16rem, 22rem);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, sans-serif;
      line-height: 1.45;
    }
    #app {
      display: grid;
      grid-template-columns: var(--rail-w) 1fr;
      height: 100vh;
      transition: grid-template-columns 0.22s ease;
    }
    #app.rail-collapsed {
      grid-template-columns: 0 1fr;
    }
    #rail {
      position: relative;
      border-right: 1px solid var(--line);
      overflow: auto;
      min-height: 0;
      min-width: 0;
      padding: 0.85rem 0 1.25rem;
      background: var(--bg);
      transition: opacity 0.18s ease, border-color 0.18s ease;
    }
    #app.rail-collapsed #rail {
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      border-right-color: transparent;
      padding: 0;
    }
    .rail-meta {
      padding: 0 1rem 0.35rem;
    }
    .rail-meta a {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }
    .rail-meta a:hover { color: var(--ink); }
    .section-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.85rem 1rem 0.35rem;
    }
    .chapter {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 0.15rem 0.55rem;
      width: 100%;
      text-align: left;
      padding: 0.55rem 1rem;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .chapter:hover { background: rgba(26, 22, 18, 0.03); }
    .chapter.active {
      background: rgba(61, 139, 110, 0.06);
      border-left-color: var(--yes);
    }
    .chapter .num {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      padding-top: 0.12rem;
    }
    .chapter .title {
      font-size: 0.88rem;
      font-weight: 600;
    }
    .chapter .tag {
      grid-column: 2;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chapter .desc {
      grid-column: 2;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    #stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }
    #frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    #empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.82rem;
      pointer-events: none;
    }
    #empty.hide { display: none; }

    #rail-toggle {
      position: absolute;
      z-index: 6;
      width: 1.7rem;
      height: 1.7rem;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: rgba(255, 254, 251, 0.96);
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(26, 22, 18, 0.04);
    }
    #rail-toggle:hover {
      color: var(--ink);
      border-color: var(--ink);
    }
    #rail-toggle svg {
      width: 0.95rem;
      height: 0.95rem;
      display: block;
    }
    #app:not(.rail-collapsed) #rail-toggle {
      top: 0.65rem;
      right: 0.55rem;
      left: auto;
    }
    #app.rail-collapsed #rail-toggle {
      top: 0.75rem;
      left: 0.55rem;
      right: auto;
    }

    @media (max-width: 820px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(11rem, 32vh) 1fr;
      }
      #app.rail-collapsed {
        grid-template-columns: 1fr;
        grid-template-rows: 0 1fr;
      }
      #rail {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      #app.rail-collapsed #rail {
        border-bottom-color: transparent;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="rail" aria-label="Diagram chapters">
      <div class="rail-meta">
        <a href="./viz_index.html">Legacy index</a>
      </div>
    </aside>
    <div id="stage">
      <button type="button" id="rail-toggle" aria-controls="rail" aria-expanded="true" aria-label="Collapse chapter list" title="Collapse chapter list">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path id="rail-toggle-icon" fill="currentColor" d="M10.2 3.2 5.4 8l4.8 4.8.9-.9L7.2 8l3.9-3.9-.9-.9z"/>
        </svg>
      </button>
      <div id="empty">Select a diagram</div>
      <iframe id="frame" title="Diagram viewer"></iframe>
    </div>
  </div>

  <script src="./viz_series.js"></script>
  <script>
    const META = {
      "big_five_tsne.html": "Open: what does “impersonating a persona” mean in an LLM’s embedding? Measurement model (MPI-120) beside the t-SNE of steered activations.",
      "big_five_persona.html": "Then: you can monotonically steer a model’s persona to be psychometrically accurate — at inference time, token by token.",
      "layer3d.html": "How: where those persona directions live in the residual stream — layer geometry and α sweep.",
      "inferno_cone.html": "After you pick a layer: climb injection dose — refuse → accept on the nine-alpha ladder.",
      "dnd_composition_board.html": "Vectors are malleable: superimpose lawful/chaotic × good/evil corners into one composed reply.",
      "omp_reconstruction_3d.html": "Decompose the steering vector into a sparse sum of SAE features (OMP fit).",
      "ssv_bubble_viz_omp.html": "Finale: which features fire as the sparse code grows with K.",
    };

    const ICONS = {
      collapse: "M10.2 3.2 5.4 8l4.8 4.8.9-.9L7.2 8l3.9-3.9-.9-.9z",
      expand: "M5.8 3.2 4.9 4.1 8.8 8l-3.9 3.9.9.9L10.6 8 5.8 3.2z",
    };

    const STORAGE_KEY = "viz-series-rail-collapsed";
    const chapters = (window.VIZ_SERIES && window.VIZ_SERIES.chapters) || [];
    const app = document.getElementById("app");
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const frame = document.getElementById("frame");
    const empty = document.getElementById("empty");
    const railToggle = document.getElementById("rail-toggle");
    const railToggleIcon = document.getElementById("rail-toggle-icon");
    let active = null;

    function placeToggle(collapsed) {
      if (collapsed) stage.appendChild(railToggle);
      else rail.appendChild(railToggle);
    }

    function setRailCollapsed(collapsed) {
      app.classList.toggle("rail-collapsed", collapsed);
      rail.setAttribute("aria-hidden", collapsed ? "true" : "false");
      railToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      const label = collapsed ? "Expand chapter list" : "Collapse chapter list";
      railToggle.setAttribute("aria-label", label);
      railToggle.title = label;
      railToggleIcon.setAttribute("d", collapsed ? ICONS.expand : ICONS.collapse);
      placeToggle(collapsed);
      try { localStorage.setItem(STORAGE_KEY, collapsed ? "1" : "0"); } catch (_) {}
    }

    railToggle.addEventListener("click", () => {
      setRailCollapsed(!app.classList.contains("rail-collapsed"));
    });

    try {
      setRailCollapsed(localStorage.getItem(STORAGE_KEY) === "1");
    } catch (_) {
      setRailCollapsed(false);
    }

    function groupLabel(g) {
      return g === "core" ? "Core chapters" : "Supplements";
    }

    function renderRail() {
      const keep = rail.querySelectorAll(".rail-meta, #rail-toggle");
      const preserved = [...keep];
      rail.innerHTML = "";
      preserved.forEach((el) => rail.appendChild(el));
      let lastGroup = null;
      for (const ch of chapters) {
        if (ch.group !== lastGroup) {
          lastGroup = ch.group;
          const lab = document.createElement("div");
          lab.className = "section-label";
          lab.textContent = groupLabel(ch.group);
          rail.appendChild(lab);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chapter" + (active === ch.file ? " active" : "");
        btn.dataset.file = ch.file;
        btn.innerHTML = `
          <span class="num">${ch.n}</span>
          <span class="title">${ch.title}</span>
          <span class="tag">${ch.tag}</span>
          <span class="desc">${META[ch.file] || ""}</span>
        `;
        btn.addEventListener("click", () => select(ch.file));
        rail.appendChild(btn);
      }
      placeToggle(app.classList.contains("rail-collapsed"));
    }

    function select(file) {
      active = file;
      frame.src = "./" + file + "?v=" + Date.now();
      empty.classList.add("hide");
      history.replaceState(null, "", "#/" + file);
      renderRail();
    }

    const fromHash = (location.hash || "").replace(/^#\/?/, "");
    const start = chapters.find((c) => c.file === fromHash)?.file
      || chapters.find((c) => c.group === "core")?.file
      || chapters[0]?.file;

    renderRail();
    if (start) select(start);
  </script>
</body>
</html>
